apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: redis
type: Opaque
stringData:
  password: REPLACE_WITH_REDIS_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: new-api-runtime
  namespace: new-api
type: Opaque
stringData:
  session-secret: REPLACE_WITH_RANDOM_SESSION_SECRET
  sql-dsn: REPLACE_WITH_MYSQL_DSN
  redis-conn-string: redis://default:REPLACE_WITH_REDIS_PASSWORD@redis.redis.svc.cluster.local:6379/0
